[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-welcome-plus"
version = "0.0.6"
description = "Welcome title plugin for Endstone servers"
authors = [
    { name = "ErwanScraft" }
]

[project.entry-points."endstone"]
welcome-plus = "welcomeplus:WelcomePlusPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/welcomeplus"]