#
# WelcomePlus Configuration
# A configurable welcome, join, leave, and sound plugin for Endstone.
#
# Documentation:
# https://github.com/ErwanScraft/WelcomePlus
# ============================================================


# ============================================================
# Welcome Title
# ============================================================
welcome:
  # Enable or disable the welcome title.
  enabled: true

  # Title displayed when a player joins.
  # Supports: {player}
  title: "§6Welcome, {player}!"

  # Subtitle displayed below the title.
  # Supports: {player}
  subtitle: "§fEnjoy your time on our server!"

  # Title fade-in duration in ticks.
  fade_in: 10

  # Title display duration in ticks.
  stay: 70

  # Title fade-out duration in ticks.
  fade_out: 20

# ============================================================
# First Join
# ============================================================
first_join:
  # Enable or disable the first-join feature.
  enabled: true

  # Message broadcast when a player joins the server for the first time.
  # Supports: {player}
  message: "§e+ §fWelcome {player} to the server for the first time!"

# ============================================================
# Join Message
# ============================================================
join_message:
  # Enable or disable the join message.
  enabled: true

  # Message broadcast when a player joins.
  # Supports: {player}
  message: "§a+ §f{player} joined the server."


# ============================================================
# Leave Message
# ============================================================
leave_message:
  # Enable or disable the leave message.
  enabled: true

  # Message broadcast when a player leaves.
  # Supports: {player}
  message: "§c- §f{player} left the server."


# ============================================================
# Join Sound
# ============================================================
sound:
  # Enable or disable the join sound.
  enabled: true

  # Minecraft Bedrock sound event name.
  name: "random.levelup"

  # Sound volume.
  volume: 1.0

  # Sound pitch.
  pitch: 1.0

# ============================================================
# Webhook
# ============================================================
webhook:
  # Enable or disable webhook notifications.
  enabled: false

  # Webhook endpoint that will receive POST requests.
  url: ""

  # Optional secret used as a Bearer token.
  # The secret is sent through the Authorization header.
  secret: ""

  # HTTP request timeout in seconds.
  timeout: 5

  # Events that can be sent to the webhook.
  events:
    # Send a webhook when a player joins the server.
    player_join: true

