# ============================================================
# WelcomePlus Configuration
# ============================================================

# ============================================================
# Welcome Title
# ============================================================
welcome:
  # Main title displayed when a player joins.
  # Supports: {player}
  title: "§6Welcome, {player}!"

  # Subtitle displayed below the main title.
  # Supports: {player}
  subtitle: "§fEnjoy your time on our server!"

  # Time in ticks before the title starts appearing.
  fade_in: 10

  # Time in ticks that the title remains visible.
  stay: 70

  # Time in ticks before the title disappears.
  fade_out: 20


# ============================================================
# Join Message
# ============================================================
# Message broadcast when a player joins the server.
join_message:
  # Enable or disable the join message.
  enabled: true

  # Supports: {player}
  message: "§a+ §f{player} joined the server."


# ============================================================
# Leave Message
# ============================================================
# Message broadcast when a player leaves the server.
leave_message:
  # Enable or disable the leave message.
  enabled: true

  # Supports: {player}
  message: "§c- §f{player} left the server."


# ============================================================
# Future Features
# ============================================================
# New features should be added as separate sections.
#
# Example:
#
# first_join:
#   enabled: true
#
# sound:
#   enabled: true
#   name: "..."
#
# Do not add configuration options for features that have
# not been implemented yet.
# ============================================================